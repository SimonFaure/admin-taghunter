; Raise upload limits for the PHP API (game-type tutorial videos, scenario
; imports, playground releases — all large media POSTs). Applies to every
; script under backend/ on hosts running PHP as CGI/FastCGI/FPM (the common
; shared-hosting case). PHP scans .user.ini from the script directory up to
; the docroot, so this file covers backend/api/*.php.
;
; NOTE: on a legacy mod_php host this file is ignored — use the php_value
; block in backend/.htaccess instead (see that file).
upload_max_filesize = 512M
post_max_size = 520M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
